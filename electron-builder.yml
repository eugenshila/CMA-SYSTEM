appId: org.cma.system
productName: CMA System
copyright: Copyright © Catholic Men Association

directories:
  output: release
  buildResources: build

# The packaged app ships the Next.js standalone server, the Electron shell, the
# desktop bootstrap (embedded PGlite + migrations) and the SQL migration files.
# `node_modules` (production dependencies only) is added automatically by
# electron-builder, so @electric-sql/pglite, pglite-socket, pg and bcryptjs ride
# along while dev-only tools (electron, sharp, typescript, …) stay out.
files:
  - electron/**
  - desktop/**
  - .next/standalone/**
  - .next/static/**
  - public/**
  - db/migrations/**
  - package.json

# The packaged app must expose REAL FILES for everything a plain Node.js child
# process reads. Electron's patched `fs` can read inside app.asar, but the
# spawned Next.js server (ELECTRON_RUN_AS_NODE=1, see desktop/bootstrap.cjs)
# cannot — so two trees have to be unpacked:
#
#   1. `.next/standalone/**` — the server itself.
#   2. `node_modules/**`     — its runtime dependencies.
#
# (2) is easy to get wrong. electron-builder puts production `node_modules`
# (package.json `dependencies`) at the TOP level of the app and *skips nested*
# node_modules directories — including `.next/standalone/node_modules`, the
# traced copy Next emits for exactly this purpose (app-builder-lib's
# AppFileWalker drops any `*/node_modules` unless `includeSubNodeModules` is
# true, which it is not by default). Unpacking the top-level tree means the
# child resolves `next` — plus the `serverExternalPackages` (`pg`, `pdfkit`,
# `exceljs`, `bcryptjs`, `qrcode`) — by walking up from
# `app.asar.unpacked/.next/standalone/` to `app.asar.unpacked/node_modules`.
# Without it the installed app dies at startup with
# `Error: Cannot find module 'next'` and never reaches the login screen.
#
# `node_modules/**` subsumes the previous narrower entries
# (`node_modules/@electric-sql/**`, `**/*.wasm`, `**/*.node`): PGlite's
# WebAssembly binary and native add-ons are unpacked as part of the whole tree.
#
# scripts/desktop-smoke.mjs guards both entries and reproduces this exact
# packaged layout — run `npm run desktop:smoke`.
asarUnpack:
  - node_modules/**
  - .next/standalone/**

extraMetadata:
  main: electron/main.cjs

win:
  target:
    - nsis
  icon: build/icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CMA System
  artifactName: ${productName}-Setup-${version}.${ext}

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.business

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Office
  maintainer: Catholic Men Association

publish: null
