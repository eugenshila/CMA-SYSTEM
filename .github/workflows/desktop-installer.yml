name: Desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Creating / updating a GitHub Release needs write access to the repo.
# Declaring this explicitly also covers orgs that set GITHUB_TOKEN to
# read-only by default (which would make `gh release create` fail).
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: --win
            asset_glob: release/*.exe
          - os: ubuntu-latest
            label: linux
            args: --linux
            asset_glob: release/*.AppImage
          - os: macos-latest
            label: macos
            args: --mac
            asset_glob: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone server
        run: npm run build

      - name: Desktop startup smoke test
        run: npm run desktop:smoke

      - name: Generate app icon
        run: npm run desktop:icons

      - name: Prepare standalone output
        run: node scripts/prepare-standalone.mjs

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cma-system-${{ matrix.label }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

      - name: Attach installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_GLOB: ${{ matrix.asset_glob }}
        run: |
          set -euo pipefail

          # Three matrix jobs race to create the same tag release.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          fi
          for _ in {1..12}; do
            gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 && break
            sleep 5
          done
          gh release view "${GITHUB_REF_NAME}" >/dev/null

          # Expand newline-separated globs in bash so:
          #  - filenames with spaces (productName "CMA System") stay intact
          #  - macOS's multiline dmg+zip glob is not passed to `gh` as one
          #    quoted argument (filepath.Glob would then match nothing)
          shopt -s nullglob
          assets=()
          while IFS= read -r pattern || [[ -n "${pattern:-}" ]]; do
            [[ -z "${pattern}" ]] && continue
            for f in ${pattern}; do
              assets+=("$f")
            done
          done <<< "${ASSET_GLOB}"

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No installer files matched:" >&2
            printf '%s\n' "${ASSET_GLOB}" >&2
            ls -la release || true
            exit 1
          fi

          printf 'Uploading %s\n' "${assets[@]}"
          gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
