name: Desktop installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: --win
            asset_glob: release/*.exe
          - os: ubuntu-latest
            label: linux
            args: --linux
            asset_glob: release/*.AppImage
          - os: macos-latest
            label: macos
            args: --mac
            asset_glob: |
              release/*.dmg
              release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js standalone server
        run: npm run build

      - name: Generate app icon
        run: npm run desktop:icons

      - name: Prepare standalone output
        run: node scripts/prepare-standalone.mjs

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cma-system-${{ matrix.label }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

      - name: Attach installers to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${{ matrix.asset_glob }}" --clobber
